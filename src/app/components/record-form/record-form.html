<div class="card shadow-sm border-0 mb-4">
  <div class="card-body">
    <h3 class="h5 mb-3" i18n="@@logServiceTitle">Szerviz rögzítése</h3>
    <form (ngSubmit)="addRecord()">
      <div class="mb-3">
        <label class="form-label" i18n="@@recordTitleLabel">Megnevezés</label>
        <input
          class="form-control"
          name="recordTitle"
          [(ngModel)]="newRecord.title"
          type="text"
          placeholder="Olajcsere"
          i18n-placeholder="@@recordTitlePlaceholder"
          required
        />
      </div>
      <div class="mb-3">
        <label class="form-label" i18n="@@recordDateLabel">Dátum</label>
        <input
          class="form-control"
          name="recordDate"
          [(ngModel)]="newRecord.date"
          type="date"
          required
        />
      </div>
      <div class="row g-2">
        <div class="col-6">
          <label class="form-label" i18n="@@recordOdometerLabel">Kilométeróra (km)</label>
          <input
            class="form-control"
            name="recordOdometer"
            [(ngModel)]="newRecord.odometer"
            type="number"
            min="0"
          />
        </div>
        <div class="col-6">
          <label class="form-label" i18n="@@recordCostLabel">Költség (HUF)</label>
          <input
            class="form-control"
            name="recordCost"
            [(ngModel)]="newRecord.cost"
            type="number"
            min="0"
          />
        </div>
      </div>
      <div class="mt-3">
        <label class="form-label" i18n="@@recordNotesLabel">Megjegyzések</label>
        <textarea
          class="form-control"
          name="recordNotes"
          [(ngModel)]="newRecord.notes"
          rows="3"
          placeholder="További részletek"
          i18n-placeholder="@@recordNotesPlaceholder"
        ></textarea>
      </div>
      @if (recordMessage$ | async; as recordMessage) {
        <div class="text-warning small mt-2">{{ recordMessage }}</div>
      }
      <button class="btn btn-dark w-100 mt-3" type="submit" i18n="@@addRecord">
        Bejegyzés hozzáadása
      </button>
    </form>
  </div>
</div>
