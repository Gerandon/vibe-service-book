<div class="row g-4 align-items-stretch">
  <div class="col-12 col-lg-6">
    <div class="card h-100 shadow-sm border-0 auth-card">
      <div class="card-body p-4">
        <h2 class="h4 mb-3" i18n="@@signInTitle">Bejelentkezés</h2>
        <p class="text-muted" i18n="@@signInSubtitle">
          Érje el járműveit és a megosztott szervizkönyveket.
        </p>
        <form class="mt-4" (ngSubmit)="login()">
          <div class="mb-3">
            <label class="form-label" i18n="@@emailLabel">Email</label>
            <input
              class="form-control"
              name="loginEmail"
              [(ngModel)]="loginEmail"
              type="email"
              placeholder="alex@example.com"
              i18n-placeholder="@@loginEmailPlaceholder"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" i18n="@@passwordLabel">Jelszó</label>
            <input
              class="form-control"
              name="loginPassword"
              [(ngModel)]="loginPassword"
              type="password"
              placeholder="demo123"
              i18n-placeholder="@@loginPasswordPlaceholder"
              required
            />
          </div>
          <button class="btn btn-dark w-100" type="submit" i18n="@@signInButton">
            Belépés
          </button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-12 col-lg-6">
    <div class="card h-100 shadow-sm border-0 auth-card accent-card">
      <div class="card-body p-4">
        <h2 class="h4 mb-3" i18n="@@registerTitle">Fiók létrehozása</h2>
        <p class="text-muted" i18n="@@registerSubtitle">
          Indítsa el saját szervizkönyvét, és hívjon meg együttműködőket.
        </p>
        <form class="mt-4" (ngSubmit)="register()">
          <div class="mb-3">
            <label class="form-label" i18n="@@nameLabel">Név</label>
            <input
              class="form-control"
              name="registerName"
              [(ngModel)]="registerName"
              type="text"
              placeholder="Kiss Andrea"
              i18n-placeholder="@@registerNamePlaceholder"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" i18n="@@registerEmailLabel">Email</label>
            <input
              class="form-control"
              name="registerEmail"
              [(ngModel)]="registerEmail"
              type="email"
              placeholder="andrea@example.com"
              i18n-placeholder="@@registerEmailPlaceholder"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" i18n="@@registerPasswordLabel">Jelszó</label>
            <input
              class="form-control"
              name="registerPassword"
              [(ngModel)]="registerPassword"
              type="password"
              placeholder="Hozzon létre jelszót"
              i18n-placeholder="@@registerPasswordPlaceholder"
              required
            />
          </div>
          <button class="btn btn-outline-dark w-100" type="submit" i18n="@@registerButton">
            Regisztráció
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
@if (authMessage$ | async; as authMessage) {
  <div class="alert alert-warning mt-4" role="alert">{{ authMessage }}</div>
}
